<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Daily Quiz: Already Played</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        h1 { font-family: 'Baloo 2', 'Nunito', sans-serif; }

        body {
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px 20px; text-align: center;
            background: linear-gradient(-45deg, #fff4e0, #f9f9f9, #ffe9cc, #fff8ee);
            background-size: 400% 400%; animation: gradientMove 12s ease infinite;
        }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        h1 { font-size: 42px; color: #e67e22; margin-bottom: 14px; }
        p { font-size: 18px; color: #555; max-width: 420px; }
    </style>
</head>

<body>
<h1>Come back tomorrow</h1>
<p>You've already played today's Daily Quiz. A new country will be waiting after midnight.</p>
</body>
</html>
