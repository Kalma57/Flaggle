<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Flaggle</title>

    <!-- Custom font pairing: Baloo 2 for bold display titles, Nunito for everything else -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>

        /* Reset default browser styles */
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1, h2, .game-title{
            font-family:'Baloo 2', 'Nunito', sans-serif;
        }

        /* Full screen animated gradient background */
        body{

            min-height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            gap:10px;
            padding:60px 20px;

            background: linear-gradient(-45deg,#e9f8f5,#f9f9f9,#dff6f1,#e6fffb);
            background-size:400% 400%;

            animation: gradientMove 12s ease infinite;

            overflow-x:hidden;
        }

        /* Gradient animation */
        @keyframes gradientMove{

            0%{
                background-position:0% 50%;
            }

            50%{
                background-position:100% 50%;
            }

            100%{
                background-position:0% 50%;
            }

        }

        /* Decorative floating glow circles — fixed so they stay put even if the page scrolls */
        .glow-circle{

            position:fixed;
            width:400px;
            height:400px;

            background:#3fc1aa;

            opacity:0.15;

            filter:blur(120px);

            border-radius:50%;

            animation: float 10s infinite alternate ease-in-out;

            pointer-events:none;

        }

        .glow2{
            top:10%;
            left:5%;
        }

        .glow3{
            bottom:10%;
            right:10%;
        }

        /* Floating animation */
        @keyframes float{

            from{
                transform:translateY(0px);
            }

            to{
                transform:translateY(-60px);
            }

        }

        /* Page header — sits above the hub container, not inside the glass panel */
        .hub-header{

            position:relative;
            z-index:1;

            text-align:center;

            margin-bottom:10px;

        }

        /* Title styling */
        h1{

            font-size:104px;

            letter-spacing:4px;

            color:#3fc1aa;

            text-shadow:
                0 10px 25px rgba(63,193,170,0.35);

            animation:titleGlow 3s infinite alternate;

        }

        /* Subtle glowing title animation */
        @keyframes titleGlow{

            from{
                text-shadow:0 5px 15px rgba(63,193,170,0.3);
            }

            to{
                text-shadow:0 10px 40px rgba(63,193,170,0.7);
            }

        }

        /* Small explanatory line under the hub title */
        .hub-subtitle{

            font-size:21px;

            color:#4a6b66;

            margin-top:10px;

            letter-spacing:1px;

        }

        /* Grid holding every game card — auto-wraps, so adding a new game later
           is just adding another .game-card element, no layout changes needed */
        .games-grid{

            position:relative;
            z-index:1;

            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
            gap:35px;

            width:100%;
            max-width:640px;

            margin-top:20px;

        }

        /* One card per game — the whole card is a single, unambiguous entry
           point ("go play this game"). Difficulty/mode selection lives one
           click deeper, on that game's own lobby page. */
        .game-card{

            position:relative;

            display:flex;
            flex-direction:column;
            align-items:center;
            text-align:center;
            gap:14px;

            padding:40px 30px 32px;

            text-decoration:none;

            background:rgba(255,255,255,0.8);

            backdrop-filter:blur(12px);

            border-radius:24px;

            border:2px solid transparent;

            box-shadow:0 15px 35px rgba(0,0,0,0.12);

            transition:all 0.35s ease;

            animation:fadeIn 1s ease;

        }

        @keyframes fadeIn{

            from{
                transform:translateY(30px);
                opacity:0;
            }

            to{
                transform:translateY(0);
                opacity:1;
            }

        }

        .game-card:hover{

            transform:translateY(-8px) scale(1.03);

            border-color:var(--accent);

            box-shadow:0 22px 45px rgba(0,0,0,0.2);

        }

        /* Icon badge — colored per game via the --accent custom property */
        .game-icon{

            width:76px;
            height:76px;

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:42px;

            border-radius:50%;

            background:linear-gradient(135deg, var(--accent), var(--accent-dark));

            box-shadow:0 10px 22px rgba(0,0,0,0.2);

        }

        .game-title{

            font-size:30px;
            letter-spacing:2px;

            color:#2c2c2c;

        }

        .game-desc{

            font-size:16px;

            color:#666;

            min-height:38px;

        }

        /* Call-to-action pill at the bottom of each card */
        .game-cta{

            margin-top:6px;

            padding:10px 28px;

            font-size:18px;
            font-weight:bold;
            letter-spacing:1px;

            color:white;

            border-radius:999px;

            background:linear-gradient(135deg, var(--accent), var(--accent-dark));

            box-shadow:0 8px 18px rgba(0,0,0,0.2);

            transition:0.3s;

        }

        .game-card:hover .game-cta{

            transform:translateY(-2px);

            box-shadow:0 12px 24px rgba(0,0,0,0.3);

        }

        .game-cta .arrow{

            display:inline-block;

            transition:transform 0.3s;

        }

        .game-card:hover .game-cta .arrow{

            transform:translateX(4px);

        }

        /* Per-game accent colors */
        .game-card.flaggle{
            --accent:#4CAF50;
            --accent-dark:#3f9142;
        }

        .game-card.globe{
            --accent:#2196F3;
            --accent-dark:#1769aa;
        }

        /* A quietly-styled placeholder card, hinting more games are coming
           without pretending to be a real, clickable game */
        .game-card.coming-soon{

            border:2px dashed #b8c9c6;

            background:rgba(255,255,255,0.4);

            box-shadow:none;

            cursor:default;

        }

        .game-card.coming-soon:hover{

            transform:none;

            border-color:#b8c9c6;

            box-shadow:none;

        }

        .game-card.coming-soon .game-icon{

            background:none;

            border:2px dashed #b8c9c6;

            color:#9fb3af;

            box-shadow:none;

        }

        .game-card.coming-soon .game-title,
        .game-card.coming-soon .game-desc{

            color:#9fb3af;

        }

    </style>
</head>

<body>

<!-- Decorative background glow elements -->
<div class="glow-circle glow2"></div>
<div class="glow-circle glow3"></div>

<!-- Hub header -->
<div class="hub-header">
    <h1>FLAGGLE</h1>
    <p class="hub-subtitle">Pick a game to play</p>
</div>

<!-- Game selection grid — each card links straight to that game's own lobby,
     where its specific modes/options are chosen -->
<div class="games-grid">

    <a class="game-card flaggle" href="/Flaggle">
        <div class="game-icon">🏳️</div>
        <h2 class="game-title">FLAGGLE</h2>
        <p class="game-desc">Guess the country by its flag</p>
        <span class="game-cta">PLAY <span class="arrow">→</span></span>
    </a>

    <a class="game-card globe" href="/Globe">
        <div class="game-icon">🌍</div>
        <h2 class="game-title">GLOBE</h2>
        <p class="game-desc">Guess the country on the map</p>
        <span class="game-cta">PLAY <span class="arrow">→</span></span>
    </a>

    <!-- Placeholder for future games (e.g. 1v1 modes) — remove once a real
         game card takes its place -->
    <div class="game-card coming-soon">
        <div class="game-icon">✨</div>
        <h2 class="game-title">More soon</h2>
        <p class="game-desc">New games and modes are on the way</p>
    </div>

</div>

</body>
</html>
